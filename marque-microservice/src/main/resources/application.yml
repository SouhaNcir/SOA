server:
  port: 8081

spring:
  # rabbitmq:
  # host: "localhost"
  # port: 5672
  # username: "guest"
  # password: "guest"
  profiles:
    active: "prod"
  config:
    import: "optional:configserver:${CONFIG_SERVICE_URL:http://localhost:9999}"
  application:
    name: marque
  datasource:
    url: 'jdbc:h2:mem:marquesdb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: true
    discovery:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
    hostname: localhost


management:
  endpoints:
    web:
      exposure:
        include: '*'