spring:
  application:
    name: "configserver"
  profiles:
    active: git
  cloud:
    bus:
      enabled: false
    config:
      server:
        git:
          uri: https://github.com/SouhaNcir/config-repo.git
          default-label: main
          clone-on-start: true

server:
  port: 9999

management:
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    rabbit:
      enabled: false